# Gera as estatísticas do perfil dentro do próprio repositório (SVGs), em vez de depender de APIs públicas que caem.
name: Atualizar perfil

on:
  schedule:
    - cron: "17 6 * * *" # todo dia, 06:17 UTC
  workflow_dispatch:
  push:
    branches: [refactor-perfil]

permissions:
  contents: write

jobs:
  cartoes:
    name: Cartões de estatísticas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: refactor-perfil
          TIME_ZONE: America/Sao_Paulo
          THEME: tokyonight
          AUTO_PUSH: true

  cobra:
    name: Cobra das contribuições
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
